<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff studio · Waggly</title><link rel="icon" href="/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"><style>
.staff-page{min-height:100vh;padding:32px 0 80px}.staff-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}.staff-header h1{font-size:40px;color:var(--green);margin:0}.staff-wrap{max-width:1100px;margin:auto;width:calc(100% - 40px)}.staff-login{max-width:420px;margin:100px auto;background:white;padding:35px;border-radius:22px;box-shadow:var(--shadow)}.staff-login h1{color:var(--green);font-size:40px}.staff-login input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;margin:10px 0 18px}.staff-grid{display:grid;grid-template-columns:1.5fr .8fr;gap:24px}.staff-panel{background:white;border-radius:19px;padding:23px;box-shadow:0 3px 20px #29342e09;margin-bottom:20px}.staff-panel h2{font-size:26px;color:var(--green);margin:0 0 16px}.booking-row{padding:17px 0;border-top:1px solid #eeeae3}.booking-top{display:flex;justify-content:space-between;gap:12px}.booking-ref{font-size:10px;letter-spacing:1px;color:var(--muted);font-weight:700}.badge{font-size:9px;font-weight:800;letter-spacing:.5px;padding:5px 8px;border-radius:99px;background:#f8e3bc;color:#765617}.badge.CONFIRMED,.badge.COMPLETED{background:#e2efde;color:#355c4a}.badge.REJECTED,.badge.CANCELLED,.badge.EXPIRED{background:#f5dfdc;color:#984d43}.badge.ALTERNATIVE_PROPOSED{background:#f7e1d4;color:#9a5b3e}.booking-row h3{font-size:18px;margin:8px 0 3px}.booking-info{font-size:12px;line-height:1.7;color:#677067}.booking-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.small-btn{border:0;background:#e8eee4;padding:8px 10px;border-radius:9px;color:var(--green);font:700 10px 'DM Sans';cursor:pointer}.small-btn.warn{background:#f9e7da;color:#8b543e}.small-btn.danger{background:#f5e3e0;color:#984d43}.staff-note{font-size:11px;color:var(--muted)}.staff-form{display:grid;gap:9px}.staff-form input,.staff-form textarea,.staff-form select{width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);font:12px 'DM Sans'}.staff-form label{font-size:11px;font-weight:700}.service-admin{padding:10px 0;border-top:1px solid var(--line);font-size:12px}.service-admin strong{display:block}.service-admin button{margin-top:6px}.date-admin{display:flex;gap:7px}.staff-error{color:#a74635;font-size:12px;min-height:18px}.staff-empty{padding:18px;background:#f8f6ef;border-radius:12px;font-size:13px;color:var(--muted)}@media(max-width:800px){.staff-grid{grid-template-columns:1fr}.staff-header{align-items:flex-start;gap:12px}}
</style></head><body><main class="staff-page"><div class="staff-wrap"><div class="staff-header"><a class="brand" href="/"><span class="brand-mark">w</span><span>Waggly<small>STAFF STUDIO</small></span></a><span class="eyebrow">PRAGUE · TEAM SPACE</span></div><div id="staff-app"><div class="staff-login"><span class="eyebrow">HELLO, WAGGLY TEAM</span><h1>Good to see you.</h1><p>Sign in to manage appointments and services.</p><form id="login-form"><label class="field">Staff password<input name="password" type="password" required autocomplete="current-password"></label><div id="login-error" class="staff-error"></div><button class="button green" type="submit">Sign in <span></span></button></form><p class="staff-note">Demo password: <b>waggly-demo</b> · change STAFF_PASSWORD before deployment.</p></div></div></div></main><div id="toast" role="status" class="toast"></div><script src="/staff.js"></script></body></html>
